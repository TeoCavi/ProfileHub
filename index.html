<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,700&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->

  <!-- Il tuo CSS -->

  <main>
    <!-- PROFILE CARD -->
    <section class="profile-card">

      <div class="profile-photo-wrapper">
        <div class="profile-photo">
          <img id="profile-img" src="">
        </div>
      </div>

      <!-- Bottone visibile sotto la sfera -->
      <div class="bulb-wrapper">
        <div class="bulb-base"></div>
        <div id="idea-toggle" class="bulb-btn" role="button" tabindex="0" aria-label="Accendi">
          <i class="fas fa-lightbulb"></i>
        </div>
      </div>

      <div class="language-wrapper">
        <div class="language-base"></div>
        <div id="language-toggle" class="bulb-btn lang-btn" role="button" tabindex="0" aria-label="Change Language">
          <img id="language-icon" src="https://hatscripts.github.io/circle-flags/flags/it.svg" alt="Italian" />
        </div>
      </div>

      <!-- Info: nome e ruolo -->
      <div class="profile-info centered">
        <h1 id="name-text" class="profile-name off"></h1>
        <p class="role" id="role"></p>
      </div>

      <!-- <div class="accent-line" id="accent-line"></div> -->

      </div>
      </div>
    </section>

    <!-- ABOUT ME -->
    <section id="about-me" class="profile-about">
      <button class="cv-button view">
        <span class="front">View CV</span>
      </button>

      <!-- Bottone Download -->
      <button class="cv-button download">
        <span class="front"><i class="fas fa-download"></i></span>
      </button>

      <!-- Toggle Button -->
      <button class="cv-toggle">
        <span class="front"><i class="fas fa-bolt"></i></span>
      </button>
    </section>


    <!-- SCIENTIFIC PUBLICATIONS -->
    <section class="section-block publications">
      <h3 class="pub-title">Scientific Publications</h3>
      <div class="container">
        <div class="cards" id="carousel"></div>
        <div class="player">
          <div class="info-area" id="test"></div>
        </div>
      </div>
    </section>

    <!-- Projects -->
    <section class="section-block projects">
      <h3 class="proj-title">Projects</h3>
      <div class="container" style="position: relative;">
        <button id="prev-project" class="project-arrow left"><i class="fas fa-chevron-left"></i></button>

        <div class="project-carousel" id="project-carousel"></div>

        <div class="project-indicators" id="project-indicators"></div>
        <button id="next-project" class="project-arrow right"><i class="fas fa-chevron-right"></i></button>
      </div>
    </section>



    <!-- PDF Modal -->
    <div id="pdf-modal" class="modal">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <iframe id="pdf-frame" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>

    <!-- Scroll to Top -->
    <button id="scrollToTopBtn">Top</button>
  </main>

  <script type="module" src="js/script.js"></script>

</body>
</html>
